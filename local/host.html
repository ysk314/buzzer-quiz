<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Host</title><link rel="stylesheet" href="local.css"><script src="/socket.io/socket.io.js"></script></head>
<body><main class="layout"><section id="setup" class="center card"><h1>👑 ローカルホスト</h1><p>同じWi‑Fiに接続してからルームを作成してください。</p><button class="button primary" id="create">ルームを作成</button></section><section id="game" class="hidden"><div class="top"><h1>👑 ローカルホスト</h1><span class="state" id="state"></span></div><div class="grid"><div class="card panel"><h2>ルーム <span id="code"></span></h2><p class="notice" id="joinUrl"></p><p class="muted">このURLをiPadで開いてください（Safariの共有からQRコードにもできます）。</p><h2 id="winner">待機中</h2><p id="voteCount" class="muted"></p><div class="controls"><button class="button primary" id="open">回答開始</button><button class="button ok" id="correct">○ 正解</button><button class="button bad" id="wrong">× 不正解</button><button class="button" id="next">次の問題</button></div><div class="card panel"><h3>回答ルール</h3><button class="button" data-rule="classic">従来ルール</button><button class="button" data-rule="support">支持投票ルール</button><p class="muted">支持投票: 正解なら回答者+2pt・○支持者+1pt。不正解なら回答者と○支持者は当問ロック。</p></div></div><div class="card panel"><h2>参加者</h2><ul id="players" class="players"></ul></div></div></section></main><script src="host.js"></script></body></html>
