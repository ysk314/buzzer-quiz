<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>早押しクイズ Local - ホスト</title><link rel="stylesheet" href="local.css"><script src="/socket.io/socket.io.js"></script></head>
<body>
<section id="setup" class="local-setup"><div class="card"><h1>👑 ローカルホスト</h1><p class="text-secondary mb-lg">同じWi-FiのiPadだけで遊ぶ、低遅延モードです。</p><button class="btn btn-primary btn-large" id="create">📝 ルームを作成</button><p class="text-muted mt-lg">このMacのファイアウォール確認が出た場合は許可してください。</p></div></section>
<main id="game" class="local-container hidden"><header class="local-header"><div class="local-room-info"><div><div class="local-info-label">LOCAL ROOM</div><div id="code" class="local-info-value">------</div></div><div><div class="local-info-label">ROUND</div><div id="state" class="local-info-value">第1問 / WAITING</div></div></div><span class="badge badge-open">LOCAL Wi-Fi</span></header>
<div class="local-grid"><section class="card local-control"><p class="text-muted">参加用URL</p><p id="joinUrl" class="local-join-url"></p><img id="qrCode" class="local-qr" alt="参加用QRコード"><p class="text-muted mt-md">QRコードをiPadで読み取るか、このURLを開いてください</p><div id="winner" class="local-winner">参加者を待っています</div><p id="voteCount" class="text-secondary"></p><div class="local-controls"><button class="btn btn-primary btn-large" id="open">🔓 回答開始</button><button class="btn btn-success btn-large" id="correct">○ 正解</button><button class="btn btn-danger btn-large" id="wrong">× 不正解</button><button class="btn btn-secondary" id="next">➡️ 次の問題</button></div><button class="btn btn-small btn-secondary hidden" id="undo">↩️ 前に戻す</button><button class="btn btn-danger mt-lg" id="finish">🏁 クイズを終了して結果発表</button><div class="mt-lg"><p class="text-muted">回答ルール</p><div class="local-rule-buttons"><button class="btn btn-secondary local-rule-button" data-rule="classic">従来ルール</button><button class="btn btn-secondary local-rule-button" data-rule="support">支持投票ルール</button></div><p class="text-muted mt-md">支持投票：正解で回答者+2pt・○支持者+1pt。不正解なら回答者と○支持者は当問ロック。</p><p class="text-muted mt-md">誤答ペナルティ</p><div class="local-rule-buttons"><button class="btn btn-secondary local-rule-button" data-setting="penaltyType" data-value="none">なし</button><button class="btn btn-secondary local-rule-button" data-setting="penaltyType" data-value="thisRound">当問ロック</button><button class="btn btn-secondary local-rule-button" data-setting="penaltyType" data-value="nextRound">次問もロック</button></div><p class="text-muted mt-md">正解加点（従来ルール）</p><div class="local-rule-buttons"><button class="btn btn-secondary local-rule-button" data-setting="correctPoints" data-value="0">なし</button><button class="btn btn-secondary local-rule-button" data-setting="correctPoints" data-value="1">+1</button><button class="btn btn-secondary local-rule-button" data-setting="correctPoints" data-value="2">+2</button><button class="btn btn-secondary local-rule-button" data-setting="correctPoints" data-value="3">+3</button></div><p class="text-muted mt-md">誤答減点</p><div class="local-rule-buttons"><button class="btn btn-secondary local-rule-button" data-setting="wrongPoints" data-value="0">なし</button><button class="btn btn-secondary local-rule-button" data-setting="wrongPoints" data-value="1">-1</button><button class="btn btn-secondary local-rule-button" data-setting="wrongPoints" data-value="2">-2</button></div></div></section>
<aside class="card"><div class="flex-between mb-md"><h3>参加者一覧</h3><span id="playerCount" class="badge badge-waiting">0人</span></div><div id="players" class="local-players"><p class="text-muted">参加者を待っています...</p></div></aside></div></main>
<script src="host.js"></script></body></html>
