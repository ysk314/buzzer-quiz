<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Player</title><link rel="stylesheet" href="local.css"><script src="/socket.io/socket.io.js"></script></head>
<body><main class="center"><section id="join" class="card"><h1>🎮 参加</h1><label>ルームコード<input id="room" maxlength="6"></label><label>名前<input id="name" maxlength="30"></label><button class="button primary" id="joinButton">参加する</button></section><section id="play" class="hidden"><div class="top"><strong id="me"></strong><strong><span id="score">0</span>pt</strong></div><p id="status" class="state">待機中</p><button id="buzzer" class="buzzer" disabled>PUSH!</button><div id="vote" class="vote hidden"><strong><span id="answerer"></span>さんの回答を支持しますか？</strong><div><button class="ok" data-vote="support">○ 支持する</button><button class="bad" data-vote="oppose">× 支持しない</button></div><p id="voteStatus" class="muted"></p></div><div class="card panel"><h3>ランキング</h3><ul id="ranking" class="players"></ul></div></section></main><script src="player.js"></script></body></html>
