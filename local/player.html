<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>早押しクイズ Local - 参加</title><link rel="stylesheet" href="local.css"><script src="/socket.io/socket.io.js"></script></head>
<body>
<section id="join" class="local-setup"><div class="card" style="width:min(100%,520px)"><h1>🎮 参加</h1><div id="roomCodeSection"><p class="text-secondary">ローカル早押しクイズに参加します</p><label class="input-group">ルームコード<input class="input" id="room" maxlength="6" autocomplete="off"></label><button class="btn btn-primary btn-large" id="checkRoomButton">ルームを確認</button></div><div id="nameSection" class="hidden"><p class="text-secondary mb-md">名前を選んでください</p><div id="nameOptions" class="name-options"></div><button class="btn btn-secondary mt-md" id="shuffleNamesButton">🔄 他の名前を見る</button></div></div></section>
<main id="play" class="local-player-container hidden"><header class="local-player-header"><div><span class="local-player-name" id="me"></span><span class="badge badge-open">PLAYER</span></div><div class="local-score"><span id="score">0</span>pt</div></header><section class="local-buzzer-area"><p id="status" class="local-status">接続中...</p><button id="buzzer" class="local-buzzer" disabled>PUSH!</button><div id="vote" class="local-vote hidden"><strong><span id="answerer"></span>さんの回答を支持しますか？</strong><div class="local-vote-buttons"><button class="btn btn-success" data-vote="support">○ 支持する</button><button class="btn btn-danger" data-vote="oppose">× 支持しない</button></div><p id="voteStatus" class="text-secondary mt-md"></p></div></section><section class="card local-ranking"><div class="local-ranking-title"><h3>🏆 ランキング</h3><span id="round" class="badge badge-waiting">第1問</span></div><div id="ranking" class="local-players mt-md"></div></section></main>
<script src="player.js"></script></body></html>
