<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>早押しクイズ - ローカル版</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main style="max-width: 680px; margin: 10vh auto; padding: 20px;">
        <section class="card">
            <h1>🖥️ このMacでローカル版を開始</h1>
            <p class="text-secondary">同じWi-FiにつないだiPadだけで遊ぶ、低遅延の早押しクイズです。</p>
            <ol class="text-secondary" style="line-height: 2;">
                <li>このMacにある <code>start-local.command</code> をダブルクリックします。</li>
                <li>ブラウザで開くローカルホスト画面からルームを作成します。</li>
                <li>表示されたLAN内URLを、参加するiPadで開きます。</li>
            </ol>
            <p class="text-muted">初回のみ、macOSから実行の確認が表示される場合があります。MacとiPadは同じWi-Fiに接続してください。</p>
            <a class="btn btn-primary" href="host.html">オンライン版に戻る</a>
        </section>
    </main>
</body>
</html>
