<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎯 早押しクイズ - プレイヤー</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <style>
        .player-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .my-name {
            font-weight: 700;
            font-size: 1.2rem;
        }

        .my-score {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent-cyan);
        }

        .buzzer-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 50vh;
        }

        .status-text {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 24px;
            text-align: center;
            min-height: 40px;
        }

        .status-waiting {
            color: var(--text-secondary);
        }

        .status-open {
            color: var(--accent-cyan);
            animation: blink 0.5s ease infinite;
        }

        .status-pressed {
            color: var(--accent-yellow);
        }

        .status-winner {
            color: var(--accent-green);
        }

        .status-locked {
            color: var(--accent-red);
        }

        .bottom-section {
            margin-top: auto;
        }

        .ranking-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 16px;
        }

        .ranking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .round-badge {
            background: var(--accent-purple);
            padding: 4px 12px;
            border-radius: var(--radius-full);
            font-weight: 600;
        }

        .join-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .join-card {
            max-width: 500px;
            width: 100%;
        }

        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .result-overlay.active {
            display: flex;
        }

        .result-content {
            text-align: center;
            animation: resultPop 0.5s ease;
        }

        @keyframes resultPop {
            from {
                transform: scale(0.5);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .result-icon {
            font-size: 8rem;
            margin-bottom: 16px;
        }

        .result-text {
            font-size: 2rem;
            font-weight: 700;
        }

        .support-vote-panel {
            width: min(100%, 360px);
            margin: 0 auto 20px;
            padding: 16px;
            text-align: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
        }

        .support-vote-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 12px;
        }

        /* 終了画面用スタイル */
        .game-finished .buzzer-area {
            display: none;
        }

        .game-finished .bottom-section {
            flex: 1;
            margin-top: 20px;
        }

        .game-finished .ranking-card {
            min-height: 60vh;
        }
    </style>
</head>

<body>
    <!-- 参加画面 -->
    <div id="joinScreen" class="join-screen">
        <div class="card join-card text-center">
            <h1>🎮 参加</h1>

            <div id="roomCodeSection">
                <p class="text-secondary mb-md">ルームコードを入力してください</p>
                <div class="input-group">
                    <input type="text" class="input" id="roomCodeInput" placeholder="ROOM-CODE" maxlength="6"
                        style="text-align: center; font-size: 1.5rem; letter-spacing: 8px; text-transform: uppercase;">
                </div>
                <button class="btn btn-primary" id="checkRoomBtn">ルームを確認</button>
            </div>

            <div id="nameSection" class="hidden">
                <p class="text-secondary mb-md">名前を選んでください</p>
                <div id="reconnectHint" class="hidden mb-md"></div>
                <div id="nameOptions" class="name-options"></div>
                <button class="btn btn-secondary mt-md" id="shuffleNamesBtn">
                    🔄 他の名前を見る
                </button>
            </div>
        </div>
    </div>

    <!-- プレイヤーメイン画面 -->
    <div id="mainScreen" class="player-container hidden">
        <header class="player-header">
            <div class="player-info">
                <span class="player-name" id="myDisplayName">Guest</span>
                <span class="player-role">PLAYER</span>
                <span class="team-badge hidden" id="myTeamBadge"></span>
            </div>
            <div class="score-stack">
                <!-- 問題数表示 -->
                <span id="playerRoundNum"
                    style="font-weight: bold; color: var(--accent-cyan); margin-right: 5px;">第1問</span>
                <div class="team-score-block hidden" id="teamScoreBlock">
                    <span class="team-name" id="myTeamName"></span>
                    <span class="team-score"><span id="teamScore">0</span>pt</span>
                </div>
                <div class="my-score" id="soloScoreBlock"><span id="myScore">0</span>pt</div>
                <div class="individual-score hidden" id="individualScoreBlock">個人 <span id="myIndividualScore">0</span>pt</div>
            </div>
            <button id="exitBtn" class="btn btn-small btn-secondary" style="margin-left: 8px;">退出</button>
        </header>

        <div class="buzzer-area">
            <h2 class="hidden" id="finishText"
                style="color: var(--accent-cyan); font-size: 2.5rem; margin-bottom: 20px;">お疲れ様でした！</h2>
            <div class="status-text" id="statusText">接続中...</div>
            <button class="buzzer-btn" id="buzzerBtn" disabled>
                <span id="buzzerText">PUSH!</span>
            </button>
            <div id="supportVotePanel" class="support-vote-panel hidden">
                <strong><span id="answererName"></span>さんの回答を支持しますか？</strong>
                <div class="support-vote-buttons">
                    <button class="btn btn-success" id="supportYesBtn">○ 支持する</button>
                    <button class="btn btn-danger" id="supportNoBtn">× 支持しない</button>
                </div>
                <p id="supportVoteStatus" class="text-secondary" style="margin: 12px 0 0;"></p>
            </div>
        </div>

        <div class="bottom-section">
            <div class="ranking-card">
                <div class="ranking-header">
                    <h3>🏆 ランキング</h3>
                    <span class="round-badge">第<span id="roundNumber">1</span>問</span>
                </div>
                <div class="ranking-columns">
                    <div class="ranking-block">
                        <h4>チーム</h4>
                        <ul class="ranking-list" id="teamRankingList">
                            <li class="text-muted">ランキング読み込み中...</li>
                        </ul>
                    </div>
                    <div class="ranking-block">
                        <h4>個人</h4>
                        <ul class="ranking-list" id="rankingList">
                            <li class="text-muted">ランキング読み込み中...</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 結果オーバーレイ -->
    <div id="resultOverlay" class="result-overlay">
        <div class="result-content" id="resultContent">
            <div class="result-icon" id="resultIcon">⭕</div>
            <div class="result-text" id="resultText">正解！</div>
        </div>
    </div>

    <script src="js/firebase-app.js"></script>
    <script>
        // 名前候補データはfetchで読み込まれます
        let namesData = null;

        document.addEventListener('DOMContentLoaded', async () => {
            let roomCode = null;
            let playerToken = localStorage.getItem('buzzer_player_token');
            let displayName = localStorage.getItem('buzzer_player_name') || null;
            let savedRoomCode = localStorage.getItem('buzzer_player_room') || null;
            let myScore = 0;
            let myTeamScore = 0;
            let playerState = 'READY';
            let roomState = 'WAITING';
            let prevScore = 0;
            let wasWinner = false;

            const joinScreen = document.getElementById('joinScreen');
            const mainScreen = document.getElementById('mainScreen');
            const roomCodeSection = document.getElementById('roomCodeSection');
            const nameSection = document.getElementById('nameSection');
            const reconnectHint = document.getElementById('reconnectHint');
            const roomCodeInput = document.getElementById('roomCodeInput');
            const buzzerBtn = document.getElementById('buzzerBtn');
            const supportVotePanel = document.getElementById('supportVotePanel');
            const supportYesBtn = document.getElementById('supportYesBtn');
            const supportNoBtn = document.getElementById('supportNoBtn');

            // 名前データを読み込み
            try {
                const response = await fetch('data/names.json');
                namesData = await response.json();
            } catch (e) {
                console.error('Failed to load names data:', e);
                // フォールバック用の空のデータ
                namesData = { modifiers: [''], characters: ['Unknown'] };
            }

            // URLからルームコード取得
            const urlParams = new URLSearchParams(window.location.search);
            const roomFromUrl = urlParams.get('room');
            if (roomFromUrl) {
                roomCodeInput.value = roomFromUrl.toUpperCase();
            } else if (savedRoomCode) {
                roomCodeInput.value = savedRoomCode.toUpperCase();
            }

            roomCodeInput.addEventListener('input', (e) => {
                e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            });

            // roomManagerが定義されるまで待機してからイベントリスナーを設定
            const setupRoomManager = () => {
                if (typeof roomManager === 'undefined') {
                    setTimeout(setupRoomManager, 100);
                    return;
                }

                async function checkRoom({ autoReconnect = false } = {}) {
                    roomCode = roomCodeInput.value.trim().toUpperCase();

                    if (roomCode.length !== 6) {
                        if (!autoReconnect) alert('ルームコードは6文字です');
                        return;
                    }

                    try {
                        const roomData = await roomManager.joinRoom(roomCode);

                        if (playerToken && roomData.players && roomData.players[playerToken]) {
                            await reconnectExistingPlayer(roomData.players[playerToken]);
                            return;
                        }

                        if (displayName && savedRoomCode === roomCode && typeof roomManager.reconnectPlayerByName === 'function') {
                            const restored = await roomManager.reconnectPlayerByName(displayName);
                            if (restored) {
                                playerToken = restored.token;
                                await reconnectExistingPlayer(restored.player);
                                return;
                            }
                        }

                        if (autoReconnect) return;
                        showNameSelection();
                    } catch (error) {
                        if (!autoReconnect) alert('ルームが見つかりません');
                    }
                }

                async function reconnectExistingPlayer(existingPlayer) {
                    const player = await roomManager.addPlayer(playerToken, existingPlayer.displayName);
                    displayName = player.displayName;
                    myScore = player.individualScore !== undefined ? player.individualScore : (player.score || 0);
                    localStorage.setItem('buzzer_player_token', playerToken);
                    localStorage.setItem('buzzer_player_name', displayName);
                    localStorage.setItem('buzzer_player_room', roomCode);
                    enterGame();
                }

                // ルーム確認
                document.getElementById('checkRoomBtn').addEventListener('click', () => {
                    checkRoom({ autoReconnect: false });
                });

                if (roomFromUrl && (playerToken || displayName)) {
                    checkRoom({ autoReconnect: true });
                }

                function showNameSelection() {
                    roomCodeSection.classList.add('hidden');
                    nameSection.classList.remove('hidden');
                    if (playerToken && displayName && savedRoomCode === roomCode) {
                        reconnectHint.className = 'mb-md';
                        reconnectHint.innerHTML = `
                            <button class="btn btn-secondary" id="reconnectButton" style="width:100%;">
                                前回の名前「${escapeHtml(displayName)}」で復帰
                            </button>
                        `;
                        document.getElementById('reconnectButton').onclick = async () => {
                            try {
                                const roomData = await roomManager.joinRoom(roomCode);
                                if (playerToken && roomData.players && roomData.players[playerToken]) {
                                    await reconnectExistingPlayer(roomData.players[playerToken]);
                                } else if (typeof roomManager.reconnectPlayerByName === 'function') {
                                    const restored = await roomManager.reconnectPlayerByName(displayName);
                                    if (restored) {
                                        playerToken = restored.token;
                                        await reconnectExistingPlayer(restored.player);
                                    } else {
                                        throw new Error('NO_RECONNECT_TARGET');
                                    }
                                } else {
                                    throw new Error('NO_RECONNECT_TARGET');
                                }
                            } catch (error) {
                                reconnectHint.classList.add('hidden');
                                playerToken = null;
                                localStorage.removeItem('buzzer_player_token');
                                generateNameOptions();
                                alert('復帰に失敗しました。名前を選び直してください。');
                            }
                        };
                    } else {
                        reconnectHint.classList.add('hidden');
                        reconnectHint.innerHTML = '';
                    }
                    
                    // namesData が読み込まれるまで待つ
                    if (!namesData || !namesData.modifiers) {
                        const checkInterval = setInterval(() => {
                            if (namesData && namesData.modifiers) {
                                clearInterval(checkInterval);
                                generateNameOptions();
                            }
                        }, 100);
                        
                        // 5秒待ってもダメなら強制的に実行
                        setTimeout(() => {
                            clearInterval(checkInterval);
                            generateNameOptions();
                        }, 5000);
                    } else {
                        generateNameOptions();
                    }
                }

                function generateNameOptions() {
                    if (!namesData || !namesData.modifiers || !namesData.characters) {
                        document.getElementById('nameOptions').innerHTML = '<p>名前データの読み込みに失敗しました</p>';
                        return;
                    }

                    const options = [];
                    for (let i = 0; i < 5; i++) {
                        const modifier = namesData.modifiers[Math.floor(Math.random() * namesData.modifiers.length)];
                        const character = namesData.characters[Math.floor(Math.random() * namesData.characters.length)];
                        options.push(modifier + character);
                    }

                    const nameOptionsEl = document.getElementById('nameOptions');
                    nameOptionsEl.innerHTML = options.map(name => `
                        <button class="name-option" data-name="${escapeHtml(name)}">${escapeHtml(name)}</button>
                    `).join('');

                    nameOptionsEl.querySelectorAll('.name-option').forEach(btn => {
                        btn.addEventListener('click', () => selectName(btn.dataset.name));
                    });
                }

                document.getElementById('shuffleNamesBtn').addEventListener('click', generateNameOptions);

                async function selectName(name) {
                    if (!confirm(`「${name}」でよろしいですか？`)) return;

                    displayName = name;
                    playerToken = generateToken();

                    try {
                        const player = await roomManager.addPlayer(playerToken, displayName);
                        displayName = player.displayName;
                        myScore = player.individualScore !== undefined ? player.individualScore : (player.score || 0);
                        localStorage.setItem('buzzer_player_token', playerToken);
                        localStorage.setItem('buzzer_player_name', displayName);
                        localStorage.setItem('buzzer_player_room', roomCode);
                        enterGame();
                    } catch (error) {
                        alert('参加に失敗しました');
                    }
                }
            };

            // setupRoomManager() を呼び出して、roomManager が定義されたらイベントリスナーを設定する
            setupRoomManager();

            async function castSupportVote(choice) {
                supportYesBtn.disabled = true;
                supportNoBtn.disabled = true;
                const result = await roomManager.castSupportVote(playerToken, choice);
                if (!result.success) {
                    document.getElementById('supportVoteStatus').textContent = '投票を受け付けられませんでした';
                }
            }

            supportYesBtn.addEventListener('click', () => castSupportVote('support'));
            supportNoBtn.addEventListener('click', () => castSupportVote('oppose'));

            function enterGame() {
                joinScreen.classList.add('hidden');
                mainScreen.classList.remove('hidden');

                document.getElementById('myDisplayName').textContent = displayName; // Changed from myName to myDisplayName
                document.getElementById('myScore').textContent = myScore;
                document.getElementById('myIndividualScore').textContent = myScore;

                // リアルタイム監視開始
                roomManager.onRoomUpdate((room) => {
                    if (room) {
                        updateUI(room);
                    }
                });

                // 切断時の処理
                window.addEventListener('beforeunload', () => {
                    if (playerToken) {
                        roomManager.disconnectPlayer(playerToken);
                    }
                });

                // 早押しボタン
                buzzerBtn.addEventListener('click', async () => {
                    if (buzzerBtn.disabled) return;
                    if (playerState !== 'READY' || roomState !== 'OPEN') return;

                    buzzerBtn.classList.add('pressed');
                    playerState = 'PRESSED';
                    updateBuzzerState();

                    const result = await roomManager.buzz(playerToken);
                    if (result.success && result.isWinner) {
                        buzzerBtn.classList.remove('pressed');
                        buzzerBtn.classList.add('winner');
                    }
                });
            }

            function updateUI(room) {
                const prevRoomState = roomState;
                roomState = room.roomState;
                document.getElementById('roundNumber').textContent = room.roundNumber || 1;

                const players = room.players || {};
                const me = players[playerToken];
                const teamMode = room.rules && room.rules.teamMode;

                if (me) {
                    // スコア変化をチェック
                    const newScore = teamMode
                        ? (me.individualScore !== undefined ? me.individualScore : (me.score || 0))
                        : (me.score || 0);
                    if (wasWinner && prevRoomState === 'LOCKED' && roomState === 'WAITING') {
                        // 判定結果があった
                        if (newScore > prevScore) {
                            showResult(true);
                        } else if (newScore < prevScore || (newScore === prevScore && room.roomState === 'OPEN')) {
                            showResult(false);
                        }
                    }

                    prevScore = myScore;
                    myScore = newScore;
                    document.getElementById('myScore').textContent = myScore;
                    document.getElementById('myIndividualScore').textContent = myScore;
                    document.getElementById('playerRoundNum').textContent = `第${room.roundNumber || 1}問`;
                    playerState = me.playerState || 'READY';
                }

                const teamScoreBlock = document.getElementById('teamScoreBlock');
                const individualScoreBlock = document.getElementById('individualScoreBlock');
                const soloScoreBlock = document.getElementById('soloScoreBlock');
                const myTeamBadge = document.getElementById('myTeamBadge');
                const myTeamName = document.getElementById('myTeamName');

                if (teamMode && me && me.teamId && room.teams && room.teams[me.teamId]) {
                    const team = room.teams[me.teamId];
                    myTeamScore = team.score || 0;
                    document.getElementById('teamScore').textContent = myTeamScore;
                    if (myTeamName) {
                        myTeamName.textContent = team.teamName || 'チーム';
                        myTeamName.style.color = team.color || 'var(--accent-cyan)';
                    }
                    if (myTeamBadge) {
                        myTeamBadge.textContent = team.teamName || 'チーム';
                        myTeamBadge.style.background = team.color || 'var(--accent-cyan)';
                        myTeamBadge.classList.remove('hidden');
                    }
                    if (teamScoreBlock) {
                        teamScoreBlock.style.border = `1px solid ${team.color || 'var(--accent-cyan)'}`;
                    }
                    if (teamScoreBlock) teamScoreBlock.classList.remove('hidden');
                    if (individualScoreBlock) individualScoreBlock.classList.remove('hidden');
                    if (soloScoreBlock) soloScoreBlock.classList.add('hidden');
                } else {
                    if (myTeamBadge) myTeamBadge.classList.add('hidden');
                    if (teamScoreBlock) teamScoreBlock.classList.add('hidden');
                    if (individualScoreBlock) individualScoreBlock.classList.add('hidden');
                    if (soloScoreBlock) soloScoreBlock.classList.remove('hidden');
                }

                // 勝者チェック
                wasWinner = room.winner && room.winner.playerToken === playerToken;
                updateSupportVote(room);

                if (roomState === 'OPEN' && prevRoomState !== 'OPEN') {
                    if (playerState === 'LOCKED_LOST' || playerState === 'PRESSED') {
                        playerState = 'READY';
                    }
                    buzzerBtn.classList.remove('pressed', 'winner', 'locked');
                } else if (roomState === 'WAITING' && prevRoomState !== 'WAITING') {
                    playerState = 'READY';
                    buzzerBtn.classList.remove('pressed', 'winner', 'locked');
                } else if (roomState === 'LOCKED') {
                    if (wasWinner) {
                        buzzerBtn.classList.add('winner');
                    } else if (playerState === 'READY') {
                        playerState = 'LOCKED_LOST';
                        buzzerBtn.classList.add('locked');
                    }
                }

                // 終了画面クラス制御
                if (roomState === 'FINISHED') {
                    document.getElementById('mainScreen').classList.add('game-finished');
                    const ft = document.getElementById('finishText');
                    if (ft) ft.classList.remove('hidden');
                } else {
                    document.getElementById('mainScreen').classList.remove('game-finished');
                    const ft = document.getElementById('finishText');
                    if (ft) ft.classList.add('hidden');
                }

                updateBuzzerState();
                updateRanking(players, room.teams || {}, room.rules || {});
            }

            function updateSupportVote(room) {
                const canVote = room.rules?.answerRule === 'support'
                    && room.roomState === 'LOCKED'
                    && room.winner
                    && room.winner.playerToken !== playerToken
                    && playerState !== 'LOCKED_PENALTY_THIS'
                    && playerState !== 'LOCKED_PENALTY_NEXT';
                if (!canVote) {
                    supportVotePanel.classList.add('hidden');
                    return;
                }

                supportVotePanel.classList.remove('hidden');
                document.getElementById('answererName').textContent = room.winner.displayName;
                const vote = (room.supportVotes || {})[playerToken];
                supportYesBtn.disabled = Boolean(vote);
                supportNoBtn.disabled = Boolean(vote);
                document.getElementById('supportVoteStatus').textContent = vote
                    ? (vote.choice === 'support' ? '○ 支持しました。判定を待っています。' : '× 支持しないを選びました。判定を待っています。')
                    : '正解なら○に+1pt。不正解なら○を選んだ人は当問ロックです。';
            }

            function updateBuzzerState() {
                const statusText = document.getElementById('statusText');
                const buzzerText = document.getElementById('buzzerText');

                statusText.className = 'status-text';

                switch (roomState) {
                    case 'WAITING':
                        statusText.textContent = '待機中...';
                        statusText.classList.add('status-waiting');
                        buzzerBtn.disabled = true;
                        buzzerText.textContent = 'WAIT';
                        break;
                    case 'OPEN':
                        if (playerState === 'READY') {
                            statusText.textContent = '🔥 早押しスタート！';
                            statusText.classList.add('status-open');
                            buzzerBtn.disabled = false;
                            buzzerText.textContent = 'PUSH!';
                        } else if (playerState === 'LOCKED_PENALTY_THIS') {
                            statusText.textContent = 'ペナルティ中...';
                            statusText.classList.add('status-locked');
                            buzzerBtn.disabled = true;
                            buzzerText.textContent = '🚫';
                        } else {
                            statusText.textContent = '押しました！';
                            statusText.classList.add('status-pressed');
                            buzzerBtn.disabled = true;
                        }
                        break;
                    case 'LOCKED':
                        if (wasWinner) {
                            statusText.textContent = '🎉 先着！判定を待っています...';
                            statusText.classList.add('status-winner');
                        } else {
                            statusText.textContent = '他の人が先着しました';
                            statusText.classList.add('status-locked');
                        }
                        buzzerBtn.disabled = true;
                        break;
                    case 'FINISHED':
                        statusText.textContent = ''; // テキスト非表示
                        buzzerBtn.disabled = true;
                        buzzerBtn.classList.add('hidden'); // ボタンを非表示
                        // ランキングがメインになるのでここはシンプルに
                        break;
                }
            }

            function updateRanking(players, teams, rules) {
                const list = document.getElementById('rankingList');
                const teamList = document.getElementById('teamRankingList');
                const playerArray = Object.values(players);

                if (playerArray.length === 0) {
                    list.innerHTML = '<li class="text-muted">まだランキングはありません</li>';
                    if (teamList) teamList.innerHTML = '<li class="text-muted">まだランキングはありません</li>';
                    return;
                }

                const sorted = playerArray.sort((a, b) => {
                    const aScore = a.individualScore !== undefined ? a.individualScore : (a.score || 0);
                    const bScore = b.individualScore !== undefined ? b.individualScore : (b.score || 0);
                    return bScore - aScore;
                }).slice(0, 5);

                list.innerHTML = sorted.map((p, i) => {
                    const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
                    const highlight = p.displayName === displayName ? 'highlight' : '';
                    const score = p.individualScore !== undefined ? p.individualScore : (p.score || 0);

                    return `
                        <li class="ranking-item ${highlight}">
                            <span class="ranking-rank ${rankClass}">${i + 1}</span>
                            <span class="ranking-name">${escapeHtml(p.displayName)}</span>
                            <span class="ranking-score">${score}pt</span>
                        </li>
                    `;
                }).join('');

                const teamArray = Object.values(teams || {});
                if (rules.teamMode && teamList && teamArray.length > 0) {
                    const teamSorted = teamArray.sort((a, b) => (b.score || 0) - (a.score || 0)).slice(0, 5);
                    teamList.innerHTML = teamSorted.map((team, i) => {
                        const fallbackTokens = Object.values(players)
                            .filter(p => p.teamId === team.teamId)
                            .map(p => p.playerToken);
                        const memberTokens = (team.members && team.members.length > 0) ? team.members : fallbackTokens;
                        const members = memberTokens.map(token => players[token]).filter(Boolean).sort((a, b) => {
                                const aScore = a.individualScore !== undefined ? a.individualScore : (a.score || 0);
                                const bScore = b.individualScore !== undefined ? b.individualScore : (b.score || 0);
                                return bScore - aScore;
                            });
                        const memberList = members.map(p => {
                            const score = p.individualScore !== undefined ? p.individualScore : (p.score || 0);
                            return `<span class="team-member-chip">${escapeHtml(p.displayName)} ${score}pt</span>`;
                        }).join('');
                        const teamName = escapeHtml(team.teamName || 'チーム');
                        const teamColor = team.color || 'var(--accent-cyan)';
                        return `
                            <li class="ranking-item team-ranking-item">
                                <div class="team-ranking-header" style="--team-color: ${teamColor};">
                                    <span class="ranking-rank">${i + 1}</span>
                                    <span class="team-name">${teamName}</span>
                                    <span class="team-score">${team.score || 0}pt</span>
                                </div>
                                <div class="team-member-chips">${memberList || '<span class="text-muted">メンバーなし</span>'}</div>
                            </li>
                        `;
                    }).join('');
                } else if (teamList) {
                    teamList.innerHTML = rules.teamMode
                        ? '<li class="text-muted">チーム未作成です</li>'
                        : '<li class="text-muted">チーム戦なし</li>';
                }
            }

            function showResult(isCorrect) {
                const overlay = document.getElementById('resultOverlay');
                const content = document.getElementById('resultContent');
                const icon = document.getElementById('resultIcon');
                const text = document.getElementById('resultText');

                if (isCorrect) {
                    icon.textContent = '⭕';
                    icon.style.color = 'var(--accent-green)';
                    text.textContent = '正解！';
                    text.style.color = 'var(--accent-green)';
                } else {
                    icon.textContent = '❌';
                    icon.style.color = 'var(--accent-red)';
                    text.textContent = '不正解...';
                    text.style.color = 'var(--accent-red)';
                }

                overlay.classList.add('active');
                setTimeout(() => overlay.classList.remove('active'), 1500);
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // 退出ボタン
            document.getElementById('exitBtn').addEventListener('click', () => {
                if (confirm('本当に退出しますか？')) {
                    if (playerToken) {
                        roomManager.disconnectPlayer(playerToken);
                    }
                    localStorage.removeItem('buzzer_player_token');
                    localStorage.removeItem('buzzer_player_name');
                    localStorage.removeItem('buzzer_player_room');
                    window.location.href = 'index.html';
                }
            });

            // Version display
            const vEl = document.createElement('div');
            vEl.style.position = 'fixed';
            vEl.style.bottom = '10px';
            vEl.style.right = '10px';
            vEl.style.color = 'rgba(255,255,255,0.3)';
            vEl.style.fontSize = '0.8rem';
            vEl.textContent = window.APP_VERSION || 'v1.7.0';
            document.body.appendChild(vEl);

        });
    </script>
</body>

</html>
